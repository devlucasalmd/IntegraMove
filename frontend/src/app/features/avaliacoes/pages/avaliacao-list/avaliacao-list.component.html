<div class="container">

  <div class="header">
    <button
      mat-raised-button
      color="primary"
      [routerLink]="['avaliacoes/nova']"
    >
      Nova Avaliação Física
    </button>
  </div>

  <!-- 🔥 SE NÃO TIVER AVALIAÇÕES -->
  <div *ngIf="avaliacoes.length === 0" class="empty-state">
    <p>Nenhuma avaliação realizada.</p>
  </div>

  <!-- 🔥 SE TIVER AVALIAÇÕES -->
  <div *ngIf="avaliacoes.length > 0">

    <mat-card class="avaliacao-card" *ngFor="let avaliacao of avaliacoes">

      <h3>Data da avaliação: {{ avaliacao.dataAvaliacao }}</h3>

      <p><strong>Avaliador:</strong> Sistema</p>
      <p><strong>Próxima avaliação:</strong> --</p>

      <button mat-stroked-button>Anamnese</button>

    </mat-card>

  </div>

</div>
