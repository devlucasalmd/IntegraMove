<h2 mat-dialog-title>{{ data.evento ? 'Editar' : 'Novo' }} evento</h2>

<form [formGroup]="form" (ngSubmit)="salvar()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Título</mat-label>
      <input matInput formControlName="titulo" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo</mat-label>
      <mat-select formControlName="tipo">
        <mat-option value="turma">Turma / Aula coletiva</mat-option>
        <mat-option value="individual">Agendamento individual</mat-option>
        <mat-option value="avaliacao">Avaliação física</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Instrutor</mat-label>
      <input matInput formControlName="instrutor" />
    </mat-form-field>

    <mat-form-field appearance="outline" *ngIf="!ehTurma">
      <mat-label>Aluno</mat-label>
      <input matInput formControlName="aluno" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Local</mat-label>
      <input matInput formControlName="local" />
    </mat-form-field>

    <mat-form-field appearance="outline" *ngIf="ehTurma">
      <mat-label>Capacidade</mat-label>
      <input matInput type="number" formControlName="capacidade" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Dia da semana</mat-label>
      <mat-select formControlName="diaSemana">
        <mat-option *ngFor="let dia of diasSemana; let i = index" [value]="i">{{ dia }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Hora início</mat-label>
      <mat-select formControlName="horaInicio">
        <mat-option *ngFor="let h of horas" [value]="h">{{ h }}:00</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Hora fim</mat-label>
      <mat-select formControlName="horaFim">
        <mat-option *ngFor="let h of horas" [value]="h">{{ h }}:00</mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Salvar</button>
  </mat-dialog-actions>
</form>
