<div class="page-header">

  <h1>Treinos</h1>

  <button
    mat-raised-button
    color="primary"
    (click)="abrirNovoTreino()"
  >
    Novo Treino
  </button>

</div>

<div class="treinos-grid">

  <mat-card
    class="treino-card"
    *ngFor="let treino of treinos"
    (click)="abrirDetalhesTreino(treino)"
  >

    <div class="card-header">

      <div>
        <h2>{{ treino.nome }}</h2>

        <p>
          Responsável: {{ treino.responsavel }}
        </p>
      </div>

      <button
        mat-icon-button
        (click)="$event.stopPropagation()"
      >
        <mat-icon>more_vert</mat-icon>
      </button>

    </div>

    <div class="card-body">

      <span class="badge">
        {{ treino.grupoMuscular }}
      </span>

      <span class="badge">
        {{ treino.nivel }}
      </span>

      <span class="badge">
        {{ treino.funcionalidade }}
      </span>

      <p class="exercicios">
        {{ treino.exercicios.length }}
        {{ treino.exercicios.length === 1 ? 'exercício' : 'exercícios' }}
      </p>

    </div>

    <div class="card-actions">

      <button
        mat-button
        color="primary"
        (click)="editarTreino(treino.id); $event.stopPropagation()"
      >
        Editar
      </button>

      <button
        mat-button
        color="warn"
        (click)="excluirTreino(treino.id); $event.stopPropagation()"
      >
        Excluir
      </button>

    </div>

  </mat-card>

</div>
