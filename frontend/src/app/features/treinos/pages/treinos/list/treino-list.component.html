<div class="treinos-container">
  <div class="page-header">
    <h1>Treinos</h1>

    <button mat-raised-button color="primary" [routerLink]="['/treino/novo']">
      Novo Treino
    </button>

    <mat-card class="table-card">
      <table mat-table [dataSource]="treinos" class="treinos-table">

        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let treino">
            {{ treino.nome }}
          </td>
        </ng-container>

        <ng-container matColumnDef="responsavel">
          <th mat-header-cell *matHeaderCellDef>Criado por</th>
          <td mat-cell *matCellDef="let treino">
            {{ treino.responsavel }}
          </td>
        </ng-container>

        <ng-container matColumnDef="funcionalidade">
          <th mat-header-cell *matHeaderCellDef>Funcionalidade</th>
          <td mat-cell *matCellDef="let treino">
            {{ treino.funcionalidade }}
          </td>
        </ng-container>

        <ng-container matColumnDef="nivel">
          <th mat-header-cell *matHeaderCellDef>Nível</th>
          <td mat-cell *matCellDef="let treino">
            {{ treino.nivel }}
          </td>
        </ng-container>

        <ng-container matColumnDef="repeticoes">
          <th mat-header-cell *matHeaderCellDef>Repeticoes</th>
          <td mat-cell *matCellDef="let treino">
            {{ treino.repeticoes }}
          </td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef>Ações</th>

          <td mat-cell *matCellDef="let treino">
            <!-- OLHO -->
            <button
              mat-icon-button
              color="primary"
              [routerLink]="['/treinos', treino.id]"
              (click)="$event.stopPropagation()"
            >
              <mat-icon>visibility</mat-icon>
            </button>

            <!-- MENU -->
            <button
              mat-icon-button
              [matMenuTriggerFor]="menu"
              (click)="$event.stopPropagation()"
            >
              <mat-icon>more_vert</mat-icon>
            </button>

            <mat-menu #menu="matMenu">
              <button mat-menu-item>
                <mat-icon>edit</mat-icon>
                <span>Editar</span>
              </button>

              <button mat-menu-item>
                <mat-icon color="warn">block</mat-icon>
                <span>Desativar</span>
              </button>

              <mat-divider></mat-divider>

              <button mat-menu-item>
                <mat-icon color="warn">delete</mat-icon>
                <span>Excluir</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>

        <tr
          mat-row
          *matRowDef="let row; columns: colunas"
          [routerLink]="['/treinos', row.id]"
          class="row-click">
        </tr>
      </table>
    </mat-card>
  </div>
