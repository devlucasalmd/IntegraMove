<div class="page-container">
  <div class="page-header">
    <h1>Exercicios</h1>

    <button mat-raised-button color="primary" [routerLink]="['/exercicio/novo']">
      Novo Exercicio
    </button>
  </div>

  <mat-card class="table-card">
    <table mat-table class="exercicio">
      <!-- NOME -->
      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell>
          Abdominal
        </td>
      </ng-container>

      <ng-container matColumnDef="grupo">
        <th mat-header-cell *matHeaderCellDef>Grupo de Exercicio</th>
        <td mat-cell *matCellDef="let aluno">Abdomen</td>
      </ng-container>

      <ng-container matColumnDef="intensidade">
        <th mat-header-cell *matHeaderCellDef>Intensidade</th>
        <td mat-cell *matCellDef="let aluno">
          {{ aluno.plano }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="status-header">Status</th>

        <td mat-cell *matCellDef="let aluno" class="status-cell">
          <span
            class="status-badge"
            [class.ativo]="aluno.ativo"
            [class.inativo]="!aluno.ativo"
          >
            {{ aluno.ativo ? "Ativo" : "Inativo" }}
          </span>
        </td>
      </ng-container>
      <!-- AÇÕES -->
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>

        <td mat-cell *matCellDef="let aluno">
          <!-- OLHO -->
          <button
            mat-icon-button
            color="primary"
            [routerLink]="['/alunos', aluno.id]"
            (click)="$event.stopPropagation()"
          >
            <mat-icon>visibility</mat-icon>
          </button>

          <!-- MENU -->
          <button
            mat-icon-button
            [matMenuTriggerFor]="menu"
            (click)="$event.stopPropagation()"
          >
            <mat-icon>more_vert</mat-icon>
          </button>

          <mat-menu #menu="matMenu">
            <button mat-menu-item>
              <mat-icon>edit</mat-icon>
              <span>Editar</span>
            </button>

            <button mat-menu-item>
              <mat-icon color="warn">block</mat-icon>
              <span>Desativar</span>
            </button>

            <mat-divider></mat-divider>

            <button mat-menu-item>
              <mat-icon color="warn">delete</mat-icon>
              <span>Excluir</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <!-- HEADER -->
      <tr mat-header-row *matHeaderRowDef="colunas"></tr>

      <!-- ROW -->
      <tr
        mat-row
        *matRowDef="let row; columns: colunas"
        [routerLink]="['/alunos', row.id]"
        class="row-click"
      ></tr>
    </table>
  </mat-card>
</div>
