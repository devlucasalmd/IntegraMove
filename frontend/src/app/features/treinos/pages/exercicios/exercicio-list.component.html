<div class="page-container">
  <div class="page-header">
    <h1>Exercicios</h1>

    <button mat-raised-button color="primary" [routerLink]="['/exercicio/novo']">
      Novo Exercicio
    </button>
  </div>

 <mat-card class="table-card">
  <table mat-table [dataSource]="exercicios" class="exercicio">

    <!-- DESCRIÇÃO -->
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let exercicio">
        {{ exercicio.nome }}
      </td>
    </ng-container>

    <!-- GRUPO MUSCULAR -->
    <ng-container matColumnDef="grupoMuscular">
      <th mat-header-cell *matHeaderCellDef>Grupo Muscular</th>
      <td mat-cell *matCellDef="let exercicio">
        {{ exercicio.grupoMuscular }}
      </td>
    </ng-container>

    <!-- INTENSIDADE -->
    <ng-container matColumnDef="intensidade">
      <th mat-header-cell *matHeaderCellDef>Intensidade</th>
      <td mat-cell *matCellDef="let exercicio">
        {{ exercicio.intensidade }}
      </td>
    </ng-container>


    <!-- AÇÕES -->
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef>Ações</th>

      <td mat-cell *matCellDef="let exercicio">
        <!-- VISUALIZAR -->
        <button
          mat-icon-button
          color="primary"
          (click)="$event.stopPropagation()"
        >
          <mat-icon>visibility</mat-icon>
        </button>

        <!-- MENU -->
        <button
          mat-icon-button
          [matMenuTriggerFor]="menu"
          (click)="$event.stopPropagation()"
        >
          <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #menu="matMenu">
          <button mat-menu-item>
            <mat-icon>edit</mat-icon>
            <span>Editar</span>
          </button>

          <button mat-menu-item>
            <mat-icon color="warn">block</mat-icon>
            <span>Desativar</span>
          </button>

          <mat-divider></mat-divider>

          <button mat-menu-item>
            <mat-icon color="warn">delete</mat-icon>
            <span>Excluir</span>
          </button>
        </mat-menu>
      </td>
    </ng-container>

    <!-- HEADER -->
    <tr mat-header-row *matHeaderRowDef="colunas"></tr>

    <!-- ROW -->
    <tr
      mat-row
      *matRowDef="let row; columns: colunas"
      class="row-click"
    ></tr>
  </table>
</mat-card>
</div>
