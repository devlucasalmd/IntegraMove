<form [formGroup]="alunoForm" class="page-container compact">
  @if (erroEnvio) {
    <div class="erro-banner">
      <i-tabler name="alert-circle"></i-tabler>
      <span>{{ erroEnvio }}</span>
    </div>
  }

  <!-- INFORMAÇÕES DO ALUNO -->
  <div class="section-card">
    <div class="section-header mini">
      <i-tabler name="info-circle"></i-tabler>
      <span>Informações do Aluno</span>
    </div>

    <div class="form-grid compact-grid">
      <!-- NOME -->
      <div class="col-6">
        <mat-form-field appearance="outline">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" />
        </mat-form-field>
      </div>

      <!-- CPF -->
      <div class="col-6">
        <mat-form-field appearance="outline">
          <mat-label>CPF</mat-label>
          <input matInput formControlName="cpf" />
        </mat-form-field>
      </div>

      <!-- GÊNERO -->
      <div class="col-6">
        <mat-form-field appearance="outline">
          <mat-label>Gênero</mat-label>
          <mat-select formControlName="genero">
            @for (g of generos; track g) {
              <mat-option [value]="g">
                {{ g }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <!-- DATA NASCIMENTO -->
      <div class="col-6">
        <mat-form-field appearance="outline">
          <mat-label>Data de Nascimento</mat-label>
          <input
            matInput
            [matDatepicker]="pickerNascimento"
            formControlName="dataNascimento"
            />
          <mat-datepicker-toggle
            matIconSuffix
            [for]="pickerNascimento"
          ></mat-datepicker-toggle>
          <mat-datepicker #pickerNascimento></mat-datepicker>
        </mat-form-field>
      </div>

      <!-- EMAIL -->
      <div class="col-6">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
        </mat-form-field>
      </div>

      <!-- TELEFONE -->
      <div class="col-6">
        <mat-form-field appearance="outline">
          <mat-label>Telefone</mat-label>
          <input matInput formControlName="telefone" />
        </mat-form-field>
      </div>

      <!-- STATUS -->
      <div class="col-6">
        <div class="radio-field">
          <label class="radio-label">Status</label>

          <mat-radio-group formControlName="ativo">
            <mat-radio-button [value]="true">Ativo</mat-radio-button>
            <mat-radio-button [value]="false">Inativo</mat-radio-button>
          </mat-radio-group>
        </div>
      </div>
    </div>
  </div>

  <!-- ENDEREÇO -->
  <div class="section-card">
    <div class="section-header mini">
      <i-tabler name="map-pin"></i-tabler>
      <span>Endereço</span>
    </div>

    <div formGroupName="enderecoDTO" class="form-grid compact-grid">
      <div class="col-6">
        <mat-form-field appearance="outline">
          <mat-label>Rua</mat-label>
          <input matInput formControlName="rua" />
        </mat-form-field>
      </div>

      <div class="col-3">
        <mat-form-field appearance="outline">
          <mat-label>Nº</mat-label>
          <input matInput formControlName="numero" />
        </mat-form-field>
      </div>

      <div class="col-3">
        <mat-form-field appearance="outline">
          <mat-label>CEP</mat-label>
          <input matInput formControlName="cep" />
        </mat-form-field>
      </div>

      <div class="col-6">
        <mat-form-field appearance="outline">
          <mat-label>Bairro</mat-label>
          <input matInput formControlName="bairro" />
        </mat-form-field>
      </div>

      <div class="col-3">
        <mat-form-field appearance="outline">
          <mat-label>Cidade</mat-label>
          <input matInput formControlName="cidade" />
        </mat-form-field>
      </div>

      <div class="col-3">
        <mat-form-field appearance="outline">
          <mat-label>UF</mat-label>
          <input matInput formControlName="estado" maxlength="2" />
        </mat-form-field>
      </div>
    </div>
  </div>

  <!-- BOTÕES -->
  <div class="actions compact-actions">
    <button
      mat-flat-button
      type="button"
      class="btn-cancel"
      (click)="fechar()"
      [disabled]="salvando"
      >
      Cancelar
    </button>

    <button
      mat-flat-button
      type="button"
      class="btn-submit"
      (click)="salvar()"
      [disabled]="salvando || alunoForm.invalid"
      >
      {{ salvando ? "Salvando..." : "Salvar" }}
    </button>
  </div>
</form>
