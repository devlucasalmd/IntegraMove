<h2 mat-dialog-title>
  <mat-icon>event_available</mat-icon>
  Histórico de presença
</h2>

<mat-dialog-content class="presenca-dialog-content">
  @if (presencas.length === 0) {
    <div class="empty-state">
      <mat-icon>event_busy</mat-icon>
      <p>Nenhuma presença registrada neste período.</p>
    </div>
  }

  @if (presencas.length > 0) {
    <mat-list>
      @for (presenca of presencas; track presenca.id) {
        <mat-list-item class="presenca-item">
          <mat-icon matListItemIcon>check_circle</mat-icon>
          <div matListItemTitle>{{ presenca.data | date:'dd/MM/yyyy' }}</div>
          <div matListItemLine>Acesso às {{ presenca.horario }}</div>
        </mat-list-item>
      }
    </mat-list>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" (click)="fechar()">Fechar</button>
</mat-dialog-actions>
